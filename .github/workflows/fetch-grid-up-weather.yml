name: Fetch Grid Up Weather

on:
  push:
    paths:
      - "grid_up_weather_fetch.py"
      - ".github/workflows/fetch-grid-up-weather.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas requests
      - name: Download district weather
        run: python grid_up_weather_fetch.py
      - name: Upload weather artifact
        uses: actions/upload-artifact@v4
        with:
          name: grid-up-weather
          path: weather_output/
          if-no-files-found: error
          retention-days: 1
