name: Fetch Public Grid Up Research Files

on:
  pull_request:
    paths:
      - "grid_up_public_fetch_trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-public-repos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trigger repository
        uses: actions/checkout@v4
      - name: Clone public research repositories
        run: |
          mkdir -p public_research
          git clone --depth 1 https://github.com/RounenRais/grid-up-datahon.git public_research/RounenRais
          git clone --depth 1 https://github.com/OmerFarukYildirim/Grid-Up-Datathon.git public_research/OmerFarukYildirim
          git clone --depth 1 https://github.com/GizemmOzcan/grid-up-datathon.git public_research/GizemmOzcan
          git clone --depth 1 https://github.com/beratmertkayacan/Grid-Up-Datathon.git public_research/beratmertkayacan
          git clone --depth 1 https://github.com/aaayseee/grid-up-datathon.git public_research/aaayseee
      - name: Remove Git metadata and raw competition data
        run: |
          find public_research -type d -name .git -prune -exec rm -rf {} +
          find public_research -type f \( -name train.csv -o -name test.csv -o -name sample_submission.csv \) -delete
          find public_research -type d -name catboost_info -prune -exec rm -rf {} +
      - name: Upload research files
        uses: actions/upload-artifact@v4
        with:
          name: public-grid-up-research-all
          path: public_research/
          if-no-files-found: error
          retention-days: 1
