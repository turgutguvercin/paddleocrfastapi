name: Fetch Public Grid Up Research Files

on:
  pull_request:
    paths:
      - "grid_up_public_fetch_trigger.txt"
      - "aa_daily_load_crawl.py"
      - "aa_search_probe.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-aa-search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trigger repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Probe AA search archive
        run: python aa_search_probe.py
      - name: Upload AA search artifact
        uses: actions/upload-artifact@v4
        with:
          name: aa-search-probe
          path: aa_search_output/
          if-no-files-found: error
          retention-days: 1
