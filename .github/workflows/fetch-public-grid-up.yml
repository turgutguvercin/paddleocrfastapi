name: Fetch Public Grid Up Research Files

on:
  pull_request:
    paths:
      - "grid_up_public_fetch_trigger.txt"
      - "aa_daily_load_crawl.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crawl-aa-load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trigger repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check pandas requests beautifulsoup4 lxml
      - name: Crawl AA daily load seed pages
        run: python aa_daily_load_crawl.py
      - name: Upload AA load artifact
        uses: actions/upload-artifact@v4
        with:
          name: aa-daily-load-seed
          path: aa_load_output/
          if-no-files-found: error
          retention-days: 1
