name: Fetch Public Grid Up Research Files

on:
  pull_request:
    paths:
      - "grid_up_public_fetch_trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-public-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trigger repository
        uses: actions/checkout@v4
      - name: Clone public research repository
        run: git clone --depth 1 https://github.com/RounenRais/grid-up-datahon.git public_grid_up
      - name: Remove competition raw data and keep research artifacts
        run: |
          rm -f public_grid_up/train.csv public_grid_up/test.csv public_grid_up/sample_submission.csv
          rm -rf public_grid_up/.git public_grid_up/catboost_info
      - name: Upload research files
        uses: actions/upload-artifact@v4
        with:
          name: public-grid-up-research
          path: public_grid_up/
          if-no-files-found: error
          retention-days: 1
